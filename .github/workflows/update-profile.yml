name: Update profile stats

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC daily
  push:
    branches: [main]
    paths-ignore:
      - 'dark_mode.svg'
      - 'light_mode.svg'
      - 'cache/**'
  workflow_dispatch: {}

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update-svgs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate stats and update SVGs
        run: python scripts/update_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated SVGs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/
          if git diff --cached --quiet; then
            echo "No stat changes, nothing to commit."
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
