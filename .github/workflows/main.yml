name: Update profile stats

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC daily
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  update-svgs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate stats and update SVGs
        run: python today.py
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/
          git diff --cached --quiet || git commit -m "chore: update stats [skip ci]"
          git push
